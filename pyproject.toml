# Tooling for the website hooks and tests. This repository is not a Python package.

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["hooks", "tests"]
exclude = ["site", ".makefiles", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
files = ["hooks", "tests"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = [".", "hooks"]
